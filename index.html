<html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lumen — Ambient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070a12;
      --bg-elevated: rgba(18, 24, 38, 0.55);
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text: #e8ecf4;
      --text-dim: #8b95a8;
      --accent: #7eb8ff;
      --accent-soft: rgba(126, 184, 255, 0.15);
      --rain: #5b9fd4;
      --forest: #6bcb8a;
      --ocean: #4db8c4;
      --fire: #e8a05c;
      --wind: #a8b4c8;
      --cafe: #c4a07a;
      --night: #9b8fd4;
      --thunder: #7a8cff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
    }

    #canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .gradient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 1;
      transition: opacity 1.2s ease, transform 8s ease;
    }

    .orb-1 {
      width: 55vmax;
      height: 55vmax;
      background: radial-gradient(circle, #1a3a5c 0%, transparent 70%);
      top: -15%;
      left: -10%;
      animation: drift 28s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 45vmax;
      height: 45vmax;
      background: radial-gradient(circle, #2a1f4a 0%, transparent 70%);
      bottom: -10%;
      right: -5%;
      animation: drift 34s ease-in-out infinite alternate-reverse;
    }

    .orb-3 {
      width: 35vmax;
      height: 35vmax;
      background: radial-gradient(circle, #1f3d35 0%, transparent 70%);
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      animation: drift 22s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(4%, 6%) scale(1.08); }
    }

    .app {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: clamp(1.2rem, 3vw, 2.5rem);
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .logo h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f0f4ff 0%, #a8c4e8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo span {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text);
      border-radius: 999px;
      padding: 0.55rem 1.1rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.14);
    }

    .btn.active {
      background: var(--accent-soft);
      border-color: rgba(126, 184, 255, 0.35);
      color: var(--accent);
    }

    .btn-icon {
      width: 42px;
      height: 42px;
      padding: 0;
      justify-content: center;
      border-radius: 50%;
    }

    .timer-display {
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      color: var(--text-dim);
      min-width: 4.5rem;
      text-align: center;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      min-height: 0;
      overflow: hidden;
    }

    .sounds {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.9rem;
      overflow-y: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .sounds::-webkit-scrollbar { width: 4px; }
    .sounds::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
    }

    .sound-card {
      position: relative;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.15rem 1rem 1rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      overflow: hidden;
    }

    .sound-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .sound-card[data-sound="rain"]::before { background: radial-gradient(circle at 50% 0%, rgba(91, 159, 212, 0.25), transparent 70%); }
    .sound-card[data-sound="forest"]::before { background: radial-gradient(circle at 50% 0%, rgba(107, 203, 138, 0.22), transparent 70%); }
    .sound-card[data-sound="ocean"]::before { background: radial-gradient(circle at 50% 0%, rgba(77, 184, 196, 0.25), transparent 70%); }
    .sound-card[data-sound="fire"]::before { background: radial-gradient(circle at 50% 0%, rgba(232, 160, 92, 0.28), transparent 70%); }
    .sound-card[data-sound="wind"]::before { background: radial-gradient(circle at 50% 0%, rgba(168, 180, 200, 0.2), transparent 70%); }
    .sound-card[data-sound="cafe"]::before { background: radial-gradient(circle at 50% 0%, rgba(196, 160, 122, 0.22), transparent 70%); }
    .sound-card[data-sound="night"]::before { background: radial-gradient(circle at 50% 0%, rgba(155, 143, 212, 0.25), transparent 70%); }
    .sound-card[data-sound="thunder"]::before { background: radial-gradient(circle at 50% 0%, rgba(122, 140, 255, 0.25), transparent 70%); }

    .sound-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
    }

    .sound-card.active {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .sound-card.active::before { opacity: 1; }

    .icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.35s ease;
    }

    .sound-card.active .icon-wrap { transform: scale(1.06); }

    .sound-card[data-sound="rain"] .icon-wrap { color: var(--rain); }
    .sound-card[data-sound="forest"] .icon-wrap { color: var(--forest); }
    .sound-card[data-sound="ocean"] .icon-wrap { color: var(--ocean); }
    .sound-card[data-sound="fire"] .icon-wrap { color: var(--fire); }
    .sound-card[data-sound="wind"] .icon-wrap { color: var(--wind); }
    .sound-card[data-sound="cafe"] .icon-wrap { color: var(--cafe); }
    .sound-card[data-sound="night"] .icon-wrap { color: var(--night); }
    .sound-card[data-sound="thunder"] .icon-wrap { color: var(--thunder); }

    .sound-card.active[data-sound="rain"] .icon-wrap { background: rgba(91, 159, 212, 0.18); }
    .sound-card.active[data-sound="forest"] .icon-wrap { background: rgba(107, 203, 138, 0.18); }
    .sound-card.active[data-sound="ocean"] .icon-wrap { background: rgba(77, 184, 196, 0.18); }
    .sound-card.active[data-sound="fire"] .icon-wrap { background: rgba(232, 160, 92, 0.2); }
    .sound-card.active[data-sound="wind"] .icon-wrap { background: rgba(168, 180, 200, 0.15); }
    .sound-card.active[data-sound="cafe"] .icon-wrap { background: rgba(196, 160, 122, 0.18); }
    .sound-card.active[data-sound="night"] .icon-wrap { background: rgba(155, 143, 212, 0.18); }
    .sound-card.active[data-sound="thunder"] .icon-wrap { background: rgba(122, 140, 255, 0.18); }

    .icon-wrap svg {
      width: 26px;
      height: 26px;
      stroke-width: 1.5;
    }

    .sound-name {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .volume-wrap {
      width: 100%;
      padding: 0 0.15rem;
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .sound-card.active .volume-wrap {
      opacity: 1;
      pointer-events: auto;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
      cursor: pointer;
    }

    .bottom-bar {
      flex-shrink: 0;
      margin-top: 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 1rem 1.25rem;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .master-volume {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 160px;
    }

    .master-volume svg {
      width: 20px;
      height: 20px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .master-volume input { flex: 1; }

    .status {
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    .status strong {
      color: var(--text);
      font-weight: 500;
    }

    .timer-panel {
      display: none;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .timer-panel.visible { display: flex; }

    .timer-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .timer-chip:hover,
    .timer-chip.active {
      background: var(--accent-soft);
      border-color: rgba(126, 184, 255, 0.3);
      color: var(--accent);
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro h2 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: -0.02em;
      text-align: center;
      background: linear-gradient(135deg, #f0f4ff 20%, #8ab4e0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .intro p {
      color: var(--text-dim);
      font-size: 1rem;
      max-width: 320px;
      text-align: center;
      line-height: 1.5;
    }

    .intro .btn {
      margin-top: 0.5rem;
      padding: 0.75rem 1.8rem;
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      .sounds { grid-template-columns: repeat(2, 1fr); }
      .bottom-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .master-volume { min-width: 100%; }
    }

    @keyframes soft-pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }
    .sound-card.active .icon-wrap {
      animation: soft-pulse 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="gradient-orb orb-1"></div>
  <div class="gradient-orb orb-2"></div>
  <div class="gradient-orb orb-3"></div>

  <div class="intro" id="intro">
    <h2>Lumen</h2>
    <p>Schaffe deinen eigenen Klangraum.<br>Mixe Ambient-Sounds für Fokus, Ruhe oder Schlaf.</p>
    <button class="btn" id="startBtn">Eintreten</button>
  </div>

  <div class="app">
    <header>
      <div class="logo">
        <h1>Lumen</h1>
        <span>Ambient Space</span>
      </div>
      <div class="header-controls">
        <span class="timer-display" id="timerDisplay"></span>
        <button class="btn btn-icon" id="timerBtn" title="Timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
          </svg>
        </button>
        <button class="btn btn-icon" id="stopAllBtn" title="Alles stoppen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
            <rect x="6" y="6" width="12" height="12" rx="1.5"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="sounds" id="sounds"></div>
    </main>

    <div class="bottom-bar">
      <div class="master-volume">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <path d="M15.54 8.46a5 5 0 010 7.07"/>
          <path d="M19.07 4.93a10 10 0 010 14.14"/>
        </svg>
        <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.7" />
      </div>
      <div class="status" id="status">Tippe auf Sounds, um sie zu mischen</div>
      <div class="timer-panel" id="timerPanel">
        <button class="timer-chip" data-min="15">15 min</button>
        <button class="timer-chip" data-min="30">30 min</button>
        <button class="timer-chip" data-min="45">45 min</button>
        <button class="timer-chip" data-min="60">60 min</button>
        <button class="timer-chip" data-min="0">Aus</button>
      </div>
    </div>
  </div>

  <script>
    const SOUNDS = [
      { id: 'rain', name: 'Regen' },
      { id: 'forest', name: 'Wald' },
      { id: 'ocean', name: 'Ozean' },
      { id: 'fire', name: 'Feuer' },
      { id: 'wind', name: 'Wind' },
      { id: 'cafe', name: 'Café' },
      { id: 'night', name: 'Nacht' },
      { id: 'thunder', name: 'Gewitter' }
    ];

    const ICONS = {
      rain: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v2M8 5v1M16 5v1"/><path d="M7 14a5 5 0 0110 0c0 3-2.5 5-5 7-2.5-2-5-4-5-7z"/><path d="M9 18l-1 2M12 19l-1 2M15 18l-1 2"/></svg>`,
      forest: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22V10"/><path d="M12 10c-3-4-6-5-6-5s1 4 3 6"/><path d="M12 10c3-4 6-5 6-5s-1 4-3 6"/><path d="M9 14c-2-2-4-2.5-4-2.5s.8 2.2 2 3.5"/><path d="M15 14c2-2 4-2.5 4-2.5s-.8 2.2-2 3.5"/></svg>`,
      ocean: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 15c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2"/><path d="M3 19c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2"/><path d="M3 11c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2"/></svg>`,
      fire: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22c4-2 6-5.5 6-9 0-4-3-7-6-10-3 3-6 6-6 10 0 3.5 2 7 6 9z"/><path d="M12 22c-1.5-1.5-2.5-3.5-2.5-5.5 0-2 1-3.5 2.5-5 1.5 1.5 2.5 3 2.5 5 0 2-1 4-2.5 5.5z"/></svg>`,
      wind: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 8h10a3 3 0 100-6"/><path d="M3 12h14a3 3 0 110 6"/><path d="M3 16h8a3 3 0 110 6"/></svg>`,
      cafe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 8h1a4 4 0 010 8h-1"/><path d="M3 8h14v9a4 4 0 01-4 4H7a4 4 0 01-4-4V8z"/><path d="M6 2v2M10 2v2M14 2v2"/></svg>`,
      night: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 14.5A8.5 8.5 0 1111.5 3a6.5 6.5 0 009.5 11.5z"/><circle cx="8" cy="9" r="0.6" fill="currentColor"/><circle cx="11" cy="7" r="0.5" fill="currentColor"/><circle cx="9.5" cy="12" r="0.5" fill="currentColor"/></svg>`,
      thunder: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>`
    };

    let audioCtx = null;
    let masterGain = null;
    const players = {};
    let masterVol = 0.7;
    let timerEnd = null;
    let timerInterval = null;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = masterVol;
      masterGain.connect(audioCtx.destination);
    }

    function createPlayer(sound) {
      const gain = audioCtx.createGain();
      gain.gain.value = 0;
      gain.connect(masterGain);

      const player = {
        gain,
        active: false,
        volume: 0.65,
        nodes: null
      };

      player.nodes = createProceduralSound(sound.id, gain);
      players[sound.id] = player;
      return player;
    }

    function createProceduralSound(id, destination) {
      const nodes = {};

      if (id === 'rain') {
        const bufferSize = 2 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1100;
        filter.Q.value = 0.45;
        const high = audioCtx.createBiquadFilter();
        high.type = 'highpass';
        high.frequency.value = 400;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.32;
        noise.connect(high);
        high.connect(filter);
        filter.connect(gain);
        gain.connect(destination);
        noise.start();
        nodes.source = noise;
      }

      else if (id === 'wind') {
        const bufferSize = 2 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        filter.Q.value = 0.7;
        const lfo = audioCtx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.08;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 180;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();
        const gain = audioCtx.createGain();
        gain.gain.value = 0.28;
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(destination);
        noise.start();
        nodes.source = noise;
        nodes.lfo = lfo;
      }

      else if (id === 'ocean') {
        const bufferSize = 3 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.7;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 280;
        const lfo = audioCtx.createOscillator();
        lfo.frequency.value = 0.07;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 120;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();
        const gain = audioCtx.createGain();
        gain.gain.value = 0.4;
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(destination);
        noise.start();
        nodes.source = noise;
        nodes.lfo = lfo;
      }

      else if (id === 'fire') {
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() > 0.995 ? (Math.random() * 2 - 1) * 0.9 : (Math.random() * 2 - 1) * 0.15;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 800;
        filter.Q.value = 1.2;
        const low = audioCtx.createBiquadFilter();
        low.type = 'lowpass';
        low.frequency.value = 200;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.32;
        noise.connect(filter);
        filter.connect(gain);
        noise.connect(low);
        low.connect(gain);
        gain.connect(destination);
        noise.start();
        nodes.source = noise;
      }

      else if (id === 'forest') {
        const bufferSize = 2 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.4;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1200;
        filter.Q.value = 0.5;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.18;
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(destination);
        noise.start();
        nodes.source = noise;

        const chirp = () => {
          if (!players.forest?.active) return;
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.frequency.value = 1800 + Math.random() * 1200;
          g.gain.value = 0;
          osc.connect(g);
          g.connect(destination);
          const now = audioCtx.currentTime;
          g.gain.linearRampToValueAtTime(0.03, now + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.2);
          setTimeout(chirp, 800 + Math.random() * 4000);
        };
        setTimeout(chirp, 1500);
      }

      else if (id === 'cafe') {
        const bufferSize = 2 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.25;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 900;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.22;
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(destination);
        noise.start();
        nodes.source = noise;
      }

      else if (id === 'night') {
        const bufferSize = 2 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.2;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 3500;
        filter.Q.value = 2;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.12;
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(destination);
        noise.start();
        nodes.source = noise;

        const cricket = () => {
          if (!players.night?.active) return;
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.value = 4200 + Math.random() * 800;
          g.gain.value = 0;
          osc.connect(g);
          g.connect(destination);
          const now = audioCtx.currentTime;
          g.gain.linearRampToValueAtTime(0.025, now + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.1);
          setTimeout(cricket, 200 + Math.random() * 600);
        };
        setTimeout(cricket, 1000);
      }

      else if (id === 'thunder') {
        const bufferSize = 3 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 180;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.3;
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(destination);
        noise.start();
        nodes.source = noise;

        const boom = () => {
          if (!players.thunder?.active) return;
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(80, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1.5);
          g.gain.setValueAtTime(0.4, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);
          osc.connect(g);
          g.connect(destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 2.1);
          setTimeout(boom, 6000 + Math.random() * 12000);
        };
        setTimeout(boom, 3000);
      }

      return nodes;
    }

    function setVolume(id, vol) {
      const p = players[id];
      if (!p) return;
      p.volume = vol;
      const target = p.active ? vol * masterVol : 0;
      p.gain.gain.cancelScheduledValues(audioCtx.currentTime);
      p.gain.gain.linearRampToValueAtTime(target, audioCtx.currentTime + 0.15);
    }

    function toggleSound(id) {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const p = players[id];
      if (!p) return;
      p.active = !p.active;
      const card = document.querySelector(`[data-sound="${id}"]`);
      if (card) card.classList.toggle('active', p.active);
      const target = p.active ? p.volume * masterVol : 0;
      p.gain.gain.cancelScheduledValues(audioCtx.currentTime);
      p.gain.gain.linearRampToValueAtTime(target, audioCtx.currentTime + 0.4);
      updateStatus();
    }

    function stopAll() {
      Object.keys(players).forEach(id => {
        const p = players[id];
        if (p.active) {
          p.active = false;
          p.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
          const card = document.querySelector(`[data-sound="${id}"]`);
          if (card) card.classList.remove('active');
        }
      });
      updateStatus();
    }

    function updateStatus() {
      const active = Object.values(players).filter(p => p.active).length;
      const el = document.getElementById('status');
      if (active === 0) {
        el.innerHTML = 'Tippe auf Sounds, um sie zu mischen';
      } else {
        el.innerHTML = `<strong>${active}</strong> Sound${active > 1 ? 's' : ''} aktiv`;
      }
    }

    function setTimer(minutes) {
      clearInterval(timerInterval);
      timerEnd = null;
      document.getElementById('timerDisplay').textContent = '';
      document.querySelectorAll('.timer-chip').forEach(c => c.classList.remove('active'));
      if (minutes <= 0) return;
      const chip = document.querySelector(`.timer-chip[data-min="${minutes}"]`);
      if (chip) chip.classList.add('active');
      timerEnd = Date.now() + minutes * 60 * 1000;
      timerInterval = setInterval(() => {
        const left = Math.max(0, timerEnd - Date.now());
        if (left <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timerDisplay').textContent = '';
          fadeOutAll();
          return;
        }
        const m = Math.floor(left / 60000);
        const s = Math.floor((left % 60000) / 1000);
        document.getElementById('timerDisplay').textContent = `${m}:${s.toString().padStart(2, '0')}`;
      }, 250);
    }

    function fadeOutAll() {
      Object.keys(players).forEach(id => {
        const p = players[id];
        if (p.active) {
          p.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 4);
          setTimeout(() => {
            p.active = false;
            const card = document.querySelector(`[data-sound="${id}"]`);
            if (card) card.classList.remove('active');
            updateStatus();
          }, 4200);
        }
      });
    }

    function buildCards() {
      const container = document.getElementById('sounds');
      SOUNDS.forEach(sound => {
        const card = document.createElement('div');
        card.className = 'sound-card';
        card.dataset.sound = sound.id;
        card.innerHTML = `
          <div class="icon-wrap">${ICONS[sound.id]}</div>
          <div class="sound-name">${sound.name}</div>
          <div class="volume-wrap">
            <input type="range" min="0" max="1" step="0.01" value="0.65" data-vol="${sound.id}" />
          </div>
        `;
        card.addEventListener('click', (e) => {
          if (e.target.matches('input')) return;
          toggleSound(sound.id);
        });
        card.querySelector('input').addEventListener('input', (e) => {
          e.stopPropagation();
          setVolume(sound.id, parseFloat(e.target.value));
        });
        container.appendChild(card);
      });
    }

    function initCanvas() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      for (let i = 0; i < 60; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.6 + 0.4,
          vx: (Math.random() - 0.5) * 0.15,
          vy: (Math.random() - 0.5) * 0.15,
          a: Math.random() * 0.35 + 0.05
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(180, 200, 240, ${p.a})`;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      SOUNDS.forEach(s => createPlayer(s));
      document.getElementById('intro').classList.add('hidden');
    });

    document.getElementById('stopAllBtn').addEventListener('click', stopAll);

    document.getElementById('masterVolume').addEventListener('input', (e) => {
      masterVol = parseFloat(e.target.value);
      if (masterGain) masterGain.gain.value = masterVol;
      Object.keys(players).forEach(id => {
        const p = players[id];
        if (p.active) {
          p.gain.gain.setValueAtTime(p.volume * masterVol, audioCtx.currentTime);
        }
      });
    });

    document.getElementById('timerBtn').addEventListener('click', () => {
      document.getElementById('timerPanel').classList.toggle('visible');
    });

    document.querySelectorAll('.timer-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        setTimer(parseInt(chip.dataset.min, 10));
      });
    });

    buildCards();
    initCanvas();
  </script>
</body>
</html>
